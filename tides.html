<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Tide Predictions – Santa Cruz, CA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <link rel="stylesheet" href="assets/css/tides.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
  <div class="container mx-auto">
    <header class="text-center mb-4">
      <h1 class="text-3xl font-bold text-blue-600">Tide Predictions</h1>
      <p class="text-xl text-gray-600">Santa Cruz, CA (subordinate)</p>

      <!-- Date navigation -->
      <div class="flex items-center justify-center space-x-2 my-2">
        <button id="prevDayBtn" class="date-nav-button">&lt;</button>
        <div id="dateDisplayContainer">
          <span id="chartDate" class="text-md text-gray-700 font-semibold cursor-pointer hover:text-blue-600"></span>
          <div id="dateDropdown" class="hidden"></div>
        </div>
        <button id="nextDayBtn" class="date-nav-button">&gt;</button>
      </div>

      <!-- Data-source toggle -->
      <div class="flex items-center justify-center space-x-6 mt-4">
        <label class="inline-flex items-center">
          <input type="radio" name="dataSource" value="noaa" class="form-radio" checked>
          <span class="ml-2">NOAA (Monterey + offsets)</span>
        </label>
        <label class="inline-flex items-center">
          <input type="radio" name="dataSource" value="stormglass" class="form-radio">
          <span class="ml-2">Storm Glass API</span>
        </label>
      </div>
    </header>

    <div id="hoverTideInfo" class="text-center text-md text-gray-700 mb-4 h-6"></div>

    <div id="loadingMessage" class="text-center text-lg text-blue-500 py-10">
      <svg class="animate-spin h-8 w-8 text-blue-500 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      Fetching tide &amp; sun data…
    </div>

    <div id="errorMessage" class="hidden text-center text-red-600 bg-red-100 p-4 rounded-lg shadow-md my-4"></div>

    <div class="chart-container bg-white p-4 sm:p-6 rounded-xl shadow-lg mb-8">
      <canvas id="tideChart"></canvas>
    </div>

    <footer class="text-center mt-12 text-sm text-gray-500">
      <p>NOAA predictions © NOAA / CO-OPS. Storm Glass data © Storm Glass.</p>
      <p>This chart is for informational purposes only and must not be used for navigation.</p>
    </footer>
  </div>

  <script src="assets/js/tides.js"></script>
</body>
</html>
