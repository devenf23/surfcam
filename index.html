<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Live DVR – Desktop & Mobile</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/surfcam.css">


</head>
<body>
  <button id="sidebarToggle">&#x2630;</button>
  <div class="container">
    <div id="sidebar">
      <button id="btn-add-urls">Add URLs</button>
      <div id="sideButtons">
        <button id="btn-show-all" class="sideBtn">Show All</button>
        <button id="btn-hide-all" class="sideBtn">Hide All</button>
      </div>
      <div id="streamList">
        <p class="no-streams">Loading streams...</p>
      </div>
      <div class="timestamp-legend" aria-label="Timestamp color legend">
        <div class="timestamp-legend-title">Timestamp colors</div>
        <div><span class="timestamp-legend-swatch exact"></span>Exact stream time</div>
        <div><span class="timestamp-legend-swatch estimated"></span>Estimated time</div>
      </div>
    </div>
    <div id="main-content"></div>
  </div>
  <div id="modalBackdrop"></div>
  <div id="urlModal">
    <h3>Paste Playlist URLs (one per line)</h3>
    <textarea id="urlInput" placeholder="https://…/playlist.m3u8"></textarea>
    <button id="saveUrls">Save and Close</button>
  </div>

  <!--
    Keep the small platform globals available while GitHub Pages replaces a
    cached JavaScript asset. The current module imports these values from
    platform.mjs; this fallback lets an older cached classic surfcam.js finish
    booting instead of failing before the stream controls are created.
  -->
  <script>
    var IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    var IS_SAFARI_MOBILE = IS_MOBILE && /iPhone|iPad|iPod/.test(navigator.userAgent) &&
      /AppleWebKit/.test(navigator.userAgent) && !/CriOS/.test(navigator.userAgent) &&
      !/FxiOS/.test(navigator.userAgent);
    var spaceHeld = false;
    window.addEventListener('keydown', event => {
      if (event.code === 'Space' && !['input', 'textarea', 'button'].includes(document.activeElement.tagName.toLowerCase())) {
        event.preventDefault();
        spaceHeld = true;
      }
    });
    window.addEventListener('keyup', event => {
      if (event.code === 'Space') spaceHeld = false;
    });
    function hideBrowserUI() {
      if (!window.matchMedia('(display-mode: standalone)').matches && !IS_SAFARI_MOBILE) {
        setTimeout(() => window.scrollTo(0, 1), 300);
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.1/dist/hls.min.js"></script>
  <script type="module" src="assets/js/surfcam.js?v=20260905-1"></script>
</body>
</html>
